<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>메리플 Marriple · 웨딩 플래너</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap');
:root{
  --bg:#fffafb;
  --paper:#ffffff;
  --ink:#271f24;
  --muted:#8a7d85;
  --line:#f0e5ea;
  --pink:#f4b7ca;
  --pink-strong:#e78dab;
  --pink-soft:#fff0f5;
  --lav:#f7f2ff;
  --peach:#fff2e8;
  --blue:#eaf2ff;
  --green:#eef9f0;
  --yellow:#fff8df;
  --shadow:0 8px 30px rgba(209,126,158,.12);
  --radius:24px;
}
*{box-sizing:border-box}
html,body{margin:0;background:linear-gradient(180deg,#fffdfd 0%,#fff7fa 100%);color:var(--ink);font-family:'Inter','Noto Sans KR',sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0;background:none}
a{text-decoration:none;color:inherit}
#app{min-height:100vh}
.safe{max-width:1180px;margin:0 auto;padding:24px}
.frame{display:grid;grid-template-columns:410px 1fr;gap:26px;align-items:start}
.phone{
  width:410px; min-height:780px; background:var(--paper); border:1px solid var(--line);
  border-radius:38px; box-shadow:0 20px 70px rgba(170,111,137,.16); overflow:hidden; position:sticky; top:20px;
}
.status{padding:18px 22px 8px; display:flex; justify-content:space-between; font-weight:700; font-size:14px}
.screen{padding:4px 18px 110px; background:linear-gradient(180deg,#fff 0%,#fffafb 100%); min-height:710px}
.header{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:8px 4px 16px}
.brand-row{display:flex; align-items:center; gap:12px}
.logo3d{width:52px; height:52px; border-radius:18px; overflow:hidden; box-shadow:0 10px 24px rgba(236,154,182,.28); flex-shrink:0}
.logo3d img{width:100%; height:100%; object-fit:cover}
.badge{display:inline-block; padding:6px 10px; font-size:11px; font-weight:700; background:var(--pink-soft); color:#b95b7f; border-radius:999px}
.title{font-size:11px; color:#b07e92; font-weight:700; letter-spacing:.08em; text-transform:uppercase}
.h1{font-size:29px; font-weight:800; line-height:1.15; letter-spacing:-.04em; margin-top:4px}
.avatar{width:42px; height:42px; border-radius:16px; background:linear-gradient(135deg,#ffe4ee,#fff7da); display:grid; place-items:center; font-size:20px}
.hero{background:linear-gradient(135deg,#fff6f9 0%, #fffdfa 52%, #fff4f7 100%); border:1px solid #f4e5eb; border-radius:28px; padding:18px; box-shadow:var(--shadow); position:relative; overflow:hidden}
.hero:after{content:''; position:absolute; right:-26px; top:-26px; width:120px; height:120px; background:radial-gradient(circle,#ffd7e5 0%, rgba(255,215,229,0) 70%)}
.hero-top{display:flex; justify-content:space-between; gap:10px; align-items:flex-start}
.kv{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px}
.kv .mini{background:rgba(255,255,255,.8); border:1px solid #f4e5eb; border-radius:18px; padding:12px}
.kv .num{font-size:20px; font-weight:800; margin-top:6px; letter-spacing:-.04em}
.week{margin-top:18px}
.week-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px}
.week-strip{display:grid; grid-template-columns:repeat(7,1fr); gap:8px}
.day-pill{padding:10px 4px 12px; border-radius:20px; text-align:center; background:#fff; border:1px solid #f3e8ec; box-shadow:0 3px 10px rgba(0,0,0,.02)}
.day-pill .dow{font-size:11px; color:var(--muted); font-weight:700}
.day-pill .date{font-size:16px; font-weight:800; margin-top:7px}
.day-pill .dot{margin:7px auto 0; width:7px; height:7px; border-radius:50%; background:#ded6da}
.day-pill.active{background:linear-gradient(180deg,#f9bfd1,#f09bb8); color:#fff; border-color:#efabc2; box-shadow:0 10px 18px rgba(231,141,171,.26)}
.day-pill.active .dow,.day-pill.active .date{color:#fff}
.day-pill.active .dot{background:#fff}
.section{margin-top:20px}
.section-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px}
.section-head h3{margin:0; font-size:18px; letter-spacing:-.03em}
.link{font-size:12px; color:#b86b8d; font-weight:700}
.todo-card{display:flex; gap:12px; align-items:flex-start; padding:14px; border-radius:20px; background:#fff; border:1px solid var(--line); box-shadow:var(--shadow); margin-bottom:10px}
.todo-icon{width:42px; height:42px; border-radius:15px; display:grid; place-items:center; font-size:20px; flex-shrink:0}
.todo-main{flex:1; min-width:0}
.todo-main strong{display:block; font-size:15px}
.todo-main small{display:block; margin-top:5px; color:var(--muted); line-height:1.45}
.todo-right{text-align:right; flex-shrink:0}
.todo-right .price{font-weight:800}
.todo-right .tag{margin-top:8px}
.tag{display:inline-block; padding:6px 10px; font-size:11px; font-weight:700; border-radius:999px}
.tag.pink{background:#fff0f5;color:#b85c81}
.tag.blue{background:#eef4ff;color:#5f84d8}
.tag.yellow{background:#fff9e6;color:#aa8a31}
.tag.green{background:#eff9f1;color:#4e9160}
.tag.peach{background:#fff0e8;color:#c07b5a}
.chips{display:flex; gap:8px; overflow:auto; padding-bottom:2px}
.chips button{padding:10px 13px; border-radius:999px; border:1px solid #f0e5ea; background:#fff; white-space:nowrap; color:#8f7e87; font-weight:700}
.chips button.active{background:var(--pink-soft); color:#b4587d; border-color:#efbfd0}
.timeline{position:relative; margin-top:8px; padding-left:18px}
.timeline:before{content:''; position:absolute; left:7px; top:8px; bottom:8px; width:3px; background:linear-gradient(180deg,#f6cad8 0%, #fdebf1 100%); border-radius:99px}
.event{position:relative; display:flex; gap:10px; margin-bottom:12px}
.dot{position:absolute; left:-18px; top:21px; width:16px; height:16px; border-radius:50%; border:3px solid #f0afc4; background:#fff}
.event-card{background:#fff; border:1px solid var(--line); border-radius:22px; box-shadow:var(--shadow); padding:14px 14px 14px 16px; flex:1}
.event-card.highlight{background:linear-gradient(135deg,#ffd5e2 0%, #fff 90%)}
.event-top{display:flex; justify-content:space-between; gap:10px; align-items:flex-start}
.event-time{font-weight:800; color:#b85d80}
.event-card p{margin:6px 0 0; color:var(--muted); font-size:13px; line-height:1.45}
.muted{color:var(--muted)}
.quickbar{position:absolute; left:50%; transform:translateX(-50%); bottom:72px; width:66px; height:66px; border-radius:24px; background:linear-gradient(180deg,#f3a8bf,#e884a5); display:grid; place-items:center; color:#fff; font-size:34px; box-shadow:0 12px 26px rgba(228,132,165,.35)}
.tabbar{position:absolute; left:0; right:0; bottom:0; background:#ffffff; border-top:1px solid var(--line); padding:10px 12px calc(12px + env(safe-area-inset-bottom)); display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:4px}
.tab{padding:0; color:#aea1a8; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; min-width:0}
.tab-hit{width:100%; max-width:58px; min-height:48px; border-radius:16px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; margin:0 auto; transition:all .18s ease}
.tab .ico{font-size:18px; line-height:1}
.tab .label{font-size:10px; line-height:1.1; white-space:nowrap}
.tab.active{color:#d57298}
.tab.active .tab-hit{background:#fff1f6; box-shadow:inset 0 0 0 1px #f6d8e4}
.tab:hover .tab-hit{background:#fff8fb}
.desktop-panel{background:#fff; border:1px solid var(--line); border-radius:30px; box-shadow:var(--shadow); padding:28px}
.desktop-panel h2{margin:0 0 8px; font-size:28px; letter-spacing:-.04em}
.desktop-panel p{color:var(--muted); line-height:1.7}
.showcase{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; margin-top:22px}
.showcard{background:#fffafb; border:1px solid var(--line); border-radius:24px; padding:18px}
.showcard h4{margin:0 0 10px; font-size:17px}
.stats-row{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin-top:18px}
.stat{background:#fff; border:1px solid var(--line); border-radius:20px; padding:16px}
.stat b{display:block; font-size:22px; margin-top:4px}
.table{width:100%; border-collapse:collapse; margin-top:10px}
.table th,.table td{border-bottom:1px solid var(--line); padding:14px 8px; text-align:left; font-size:14px}
.table th{font-size:12px; color:#9c8f96}
.table tr:last-child td{border-bottom:0}
.tool-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:18px}
.btn{padding:12px 16px; border-radius:16px; font-weight:800}
.btn.primary{background:linear-gradient(180deg,#f2a8bf,#e888a7); color:#fff; box-shadow:0 10px 22px rgba(231,136,167,.3)}
.btn.soft{background:#fff0f5; color:#b45b80}
.btn.white{background:#fff; border:1px solid var(--line); color:#866d79}
.modalbg{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(34,24,31,.42); z-index:30; padding:16px}
.modal{width:min(520px,100%); max-height:90vh; overflow:auto; background:#fff; border-radius:28px; padding:24px; box-shadow:0 24px 70px rgba(68,37,53,.22)}
.modal h3{margin:0 0 6px; font-size:23px}
.modal p{margin:0 0 18px; color:var(--muted); font-size:13px; line-height:1.6}
.fields{display:grid; gap:12px}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.field label{display:block; font-size:12px; font-weight:800; color:#9c8691; margin-bottom:7px}
.field input,.field select,.field textarea{width:100%; padding:12px 13px; border-radius:14px; border:1px solid #eadfe4; background:#fff}
.field textarea{min-height:90px; resize:vertical}
.field input[type="date"]{min-height:52px;line-height:1.2;text-align:left;-webkit-appearance:none;appearance:none}
.field input[type="date"]::-webkit-date-and-time-value{text-align:left}
.money-preview{margin-top:6px;font-size:12px;color:#9c8691;line-height:1.45}
.location-help{font-size:12px;color:#927783;line-height:1.65}.location-advanced{border:1px solid #f0e3e9;border-radius:14px;padding:10px 12px;background:#fffbfd}.location-advanced summary{font-size:12px;font-weight:700;color:#997887;cursor:pointer}.location-advanced .field{margin-top:12px}.location-preview{display:flex;gap:10px;align-items:flex-start}.location-preview .pin{font-size:20px;flex-shrink:0}.location-preview strong{display:block;color:#694c5b;margin-bottom:3px}.location-preview small{display:block;line-height:1.5;color:#947d88}.modal .location-advanced{max-width:100%}
.footer{display:flex; justify-content:flex-end; gap:8px; margin-top:20px}
.preview-place{padding:12px; background:#fff8fb; border:1px solid #f2dde6; border-radius:16px; font-size:13px; color:#7c6a73}
.toast{position:fixed; bottom:26px; left:50%; transform:translateX(-50%); z-index:60; background:#47323b; color:#fff; padding:12px 16px; border-radius:14px; box-shadow:var(--shadow)}
.desktop-notice{margin-top:20px; padding:15px 16px; border-radius:18px; background:#fff6f9; color:#8d6a79; border:1px solid #f3dbe5; font-size:13px; line-height:1.7}
.small{font-size:12px}
@media (max-width:980px){
  .safe{padding:0}
  .frame{display:block}
  .phone{width:100%; max-width:none; min-height:100vh; border-radius:0; border:0; box-shadow:none; position:relative; top:0}
  .desktop-panel{display:none}
}
@media (max-width:420px){
  .row2,.stats-row,.showcase{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr 1fr}
}

/* Marriple v5 – actual in-app redesign */
.phone{border-radius:32px}.screen{padding:8px 21px 115px}.header{padding-bottom:23px}.h1{font-size:25px}.hero{box-shadow:none;border-color:#f7e1e9}.todo-card{box-shadow:none;border-color:#f3e9ed}.todo-icon{border-radius:17px}.section-head h3{font-size:17px}.section{margin-top:25px}
.cal-hero{background:#fff;border:1px solid #f2e7eb;border-radius:25px;padding:16px;box-shadow:0 7px 25px #e8bccf18}
.cal-head,.cal-controls{display:flex;justify-content:space-between;align-items:center;gap:10px}.cal-head h3{font-size:22px;margin:4px 0 14px}.cal-arrows{display:flex;gap:6px}.cal-arrows button{width:30px;height:30px;border-radius:12px;background:#fff4f7;font-size:22px;color:#ba7691}.cal-controls{margin-bottom:17px}.mode-switch{display:flex;background:#f8f3f5;border-radius:12px;padding:4px}.mode-switch button{font-size:12px;font-weight:800;padding:8px 14px;border-radius:10px;color:#a1929b}.mode-switch button.on{background:#fff;box-shadow:0 2px 8px #00000009;color:#bd6c8a}
.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.cal-weekname{text-align:center;font-size:11px;color:#a3949c;padding-bottom:9px;font-weight:700}.cal-weekname.sunday{color:#e890a9}.cal-day{height:42px;min-width:0;border-radius:12px;background:#fff;font-size:13px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.cal-day:hover{background:#fff5f9}.cal-day.chosen{background:#e990af;color:#fff;box-shadow:0 5px 12px #e990af36}.cal-day.outside{color:#d9ced5}.cal-dots{height:5px;display:flex;justify-content:center;gap:3px}.cdot{display:inline-block;width:5px;height:5px;border-radius:50%;background:#eca7bb}.cdot.pink{background:#e990af}.cdot.blue{background:#80adf2}.cdot.peach{background:#e7aa84}.cdot.green{background:#93c8a2}.cdot.yellow{background:#e1c477}.cdot.lav{background:#bfa5e8}.cal-day.chosen .cdot{background:#fff}.cal-legend{display:flex;gap:11px;flex-wrap:wrap;margin-top:15px;font-size:10px;color:#a18c96}.cal-legend span{display:flex;align-items:center;gap:5px}
.filter-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.filter-tile{border-radius:17px;background:#fff;border:1px solid #f1e6eb;min-height:75px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#8a7c84;font-size:11px;font-weight:800}.filter-tile .filter-icon{font-size:22px}.filter-tile.active{border-color:#eca8c1;background:#fff1f6;color:#bc6586;box-shadow:0 5px 15px #e9a8c026}.count{font-size:12px;color:#d48ca8}.empty-schedule{margin:10px 0 0;background:#fff8fb;border:1px dashed #efd4df;border-radius:21px;padding:27px 12px;text-align:center}.empty-schedule span{font-size:31px;display:block;margin-bottom:7px}.empty-schedule strong{font-size:13px}.empty-schedule p{font-size:11px;color:#9b8c96;line-height:1.5}
.shortcut-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}.shortcut-grid button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;min-height:72px;background:white;border-radius:16px;border:1px solid #f0e5ea;font-size:10px;color:#866d79;font-weight:800}.shortcut-grid span{font-size:22px}.shortcut-grid button:hover{background:#fff1f6}
@media(max-width:980px){.phone{border-radius:0}.screen{padding:8px 18px 118px}}
/* v6: entirely white app surfaces, pink only as an accent */
:root{--bg:#ffffff;--paper:#ffffff}
html,body,#app,.safe,.phone,.screen,.desktop-panel{background:#ffffff!important}
.hero{background:#ffffff!important;border:1px solid #f1e5ea;box-shadow:0 5px 18px rgba(120,80,100,.045)}
.hero:after{display:none}
.showcard,.desktop-notice{background:#ffffff}
.todo-card,.stat,.event-card,.day-pill,.cal-day,.filter-tile{background:#ffffff}
.event-card.highlight{background:#ffffff; border:2px solid #eda9c0}
.day-pill.active,.cal-day.chosen{background:#e991af}

/* v7 Calm Rose — lower saturation and contrast while keeping a white canvas */
:root{--bg:#FFFFFF;--paper:#FFFFFF;--ink:#302D30;--muted:#817D80;--line:#EDE9EB;--pink:#E8D6DD;--pink-strong:#AF8998;--pink-soft:#FAF6F8;--peach:#FCF8F4;--blue:#F4F7FA;--lav:#F8F6FB;--green:#F5F9F5;--yellow:#FBF9F2;--shadow:0 3px 12px rgba(45,35,40,.035)}
.hero,.hero:after{background:#FFFFFF!important}
.hero{border-color:#EEE9EC;box-shadow:none}
.hero .badge,.badge,.tag.pink{background:#F8F3F5;color:#967380}
.tab.active,.link,.event-time{color:#A97F8F}
.tab.active .tab-hit,.filter-tile.active,.chips button.active{background:#F8F3F5!important;color:#977686!important;border-color:#E7D7DE!important;box-shadow:none!important}
.cal-day.chosen,.day-pill.active{background:#B695A2!important;box-shadow:none!important}
.quickbar,.btn.primary{background:#B695A2!important;box-shadow:none!important}
.todo-card,.event-card,.card,.cal-hero{box-shadow:none!important;border-color:#EEE9EC}
.todo-icon{filter:saturate(.7)}


/* v9 · lightweight roadmap & reserved ad inventory */
:root{--pink:#D6B3BF;--pink-strong:#B48D9A;--pink-soft:#FAF5F7;--line:#F0E9ED;--shadow:none}
.ad-slot{position:absolute;left:0;right:0;bottom:81px;height:58px;border-top:1px solid #ece9ea;background:#f8f8f8;display:flex;align-items:center;justify-content:center;gap:12px;color:#989198;font-size:11px;z-index:2}
.ad-slot strong{font-size:12px;font-weight:600;color:#777079}.ad-label{font-size:9px;border:1px solid #ddd7db;border-radius:4px;padding:3px 5px;letter-spacing:.06em}
.ad-slot .ad-close{font-size:10px;border-bottom:1px solid #a39aa0;color:#8e7b83;padding:3px}

.phone:not(.has-ad) .quickbar{bottom:84px}

.road-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.road-head h3{font-size:17px;margin:0}.road-desc{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.55}
.road-track{height:7px;border-radius:9px;background:#f4eef0;overflow:hidden;margin:13px 0 15px}.road-progress{height:100%;border-radius:9px;background:#BDA0A9;transition:width .25s}
.quest{display:flex;width:100%;align-items:center;text-align:left;gap:11px;padding:11px 0;border-top:1px solid #f4eff1}.quest-mark{flex:0 0 34px;height:34px;border-radius:12px;background:#faf7f8;color:#a19097;display:grid;place-items:center;font-weight:800}.quest.done .quest-mark{background:#e9f3ec;color:#648474}.quest-title{font-size:13px;font-weight:700}.quest-sub{font-size:11px;color:var(--muted);margin-top:3px}.quest.done .quest-title{color:#81747c}.quest-lock{margin-left:auto;color:#9c8e96;font-size:11px}
.home-topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.home-topline h3{font-size:17px;margin:0}.road-toggle{font-size:12px;color:#987f89;font-weight:700}
.variant-chip{position:fixed;right:20px;top:18px;z-index:20;border:1px solid #e8dce1;border-radius:999px;background:white;box-shadow:0 6px 20px #0000000b;padding:9px 14px;font-size:12px;color:#7e6570;font-weight:700}
@media(max-width:980px){.variant-chip{right:12px;top:10px}.phone{min-height:100vh}.ad-slot{position:fixed;bottom:79px}.tabbar{position:fixed}.quickbar{position:fixed!important;left:50%}.phone.has-ad .screen{padding-bottom:240px}.phone:not(.has-ad) .screen{padding-bottom:180px}}


/* v10: payment detail + mobile invitation vault */
.pay-method{display:inline-block;padding:3px 8px;border-radius:8px;background:#f5f0f2;font-size:11px;color:#796b73;margin-top:5px}

/* v11 · Figma-inspired white 3D home / consistent inner screens */
:root{--pink:#D4B5B8;--pink-strong:#B998A2;--pink-soft:#FBF5F6;--shadow:0 5px 22px rgba(62,45,53,.035);--line:#F0E9EC;--ink:#29252A;--muted:#6F676C}
html,body,#app,.safe,.phone,.screen{background:#fff!important}
.phone{box-shadow:0 10px 45px #35252f13;border-color:#eee9ed}
.status{color:#AE828D;font-size:17px;letter-spacing:-.03em;padding-top:19px}
.status span:last-child{font-size:10px;color:#A89FA2;letter-spacing:.02em}
.header{margin-bottom:12px}.header .logo3d{display:none}.header .avatar{background:#FAF3F5;font-size:15px}.header .h1{font-size:25px}.header .title{font-size:10px}
.phone:has(.m-home) .header{display:none}
.m-home{margin-top:11px;padding-bottom:20px}
.m-greeting{display:flex;justify-content:space-between;align-items:center;color:#93888E;font-size:13px;font-weight:700}
.m-days{background:#FCF3F5;color:#B08996;border-radius:24px;padding:7px 14px;font-weight:850;font-size:16px}
.m-heading{font-size:25px;letter-spacing:-.065em;margin:5px 0 23px;color:#2C282A;line-height:1.27}
.m-budget{display:grid;grid-template-columns:1fr 1fr;gap:0;padding-bottom:12px;border-bottom:1px solid #F2EDF0}
.m-budget>div{padding:0 11px 0 2px}.m-budget>div+div{border-left:1px solid #F0EBED;padding-left:19px}
.m-budget small{font-size:12px;display:block;color:#999097;margin-bottom:9px}.m-budget strong{font-size:18px;letter-spacing:-.055em;white-space:nowrap}
.m-character{position:relative;display:flex;justify-content:center;align-items:center;margin:6px auto 14px;min-height:258px;background:radial-gradient(ellipse at center,#FCF6F1 0%,#fff 71%);overflow:hidden}
.m-character img{object-fit:contain;width:auto;max-width:78%;height:239px;filter:drop-shadow(0 10px 10px #a98f8021)}
.m-character-label{position:absolute;bottom:5px;color:#9F9595;font-size:11px;letter-spacing:-.02em;white-space:nowrap}
.m-today{border:1px solid #F1ECEE;border-radius:20px;padding:16px 17px;background:white}
.m-headline{display:flex;justify-content:space-between;align-items:center}.m-headline h3{margin:0;font-size:17px}.m-headline button{color:#B78E9A;font-size:12px;font-weight:700}
.m-next{display:flex;align-items:center;gap:12px;border-top:1px solid #F5F0F2;margin-top:13px;padding-top:12px}
.m-next .m-round{background:#FBF2F5;color:#B18D9D;border-radius:13px;display:grid;place-items:center;width:38px;height:38px;flex-shrink:0;font-size:18px;font-weight:800}
.m-next strong{display:block;font-size:13px}.m-next small{display:block;font-size:11px;color:#91858D;margin-top:4px}.m-empty{font-size:12px;color:#938991;padding:14px 0 2px}
.m-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0}.m-actions button{background:#F8F2F2;border-radius:16px;color:#866970;font-size:13px;font-weight:800;padding:14px 5px}.m-actions button:first-child{background:#CDA8A7;color:#fff}
.m-mini-road{border:1px solid #F0E9EC;border-radius:18px;padding:15px 16px;display:grid;grid-template-columns:1fr auto;gap:8px 10px}
.m-mini-road strong{font-size:14px}.m-mini-road small{display:block;margin-top:5px;color:#998F93;font-size:11px}.m-mini-road>span{color:#A38290;font-size:13px;font-weight:800}
.m-road-bar{grid-column:1/-1;background:#F3EDF0;border-radius:30px;height:7px;overflow:hidden}.m-road-bar i{display:block;background:#BDA1AC;border-radius:30px;height:100%}
.m-mini-road details{grid-column:1/-1;font-size:12px;color:#93828B}.m-mini-road summary{cursor:pointer;font-weight:700;padding:6px 0}.m-check{padding:6px 0;border-top:1px solid #F5F0F2;color:#4D454A}.m-check span{color:#A78A96;margin-right:11px}
.hero,.stat,.todo-card,.event-card,.cal-hero{box-shadow:none!important}
.tabbar{background:white}.tab.active .tab-hit{background:#FAF1F4;border-color:#EACDD7}.tab.active{color:#B38A98}.quickbar{background:#C6A0A9;box-shadow:0 8px 20px #C6A0A930}
@media(max-width:980px){.safe{padding:0}.phone{border:0}}

/* v12 · category/action separation and narrow-screen resilience */
.phone,.screen,.desktop-panel,.modal{min-width:0}
.todo-main,.event-card,.event-top>div,.m-next>div,.showcard,.stat{min-width:0;overflow-wrap:anywhere;word-break:keep-all}
.todo-card,.event-top,.m-next{min-width:0}
.todo-right{max-width:46%;overflow-wrap:anywhere}
.todo-right .price,.stat b,.m-budget strong{font-size:clamp(12px,3.6vw,19px);white-space:normal;overflow-wrap:anywhere}
.filter-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.filter-tile{min-width:0;padding:9px 3px;text-align:center;overflow-wrap:anywhere;word-break:keep-all}
.filter-tile .filter-icon{font-size:19px}
.field select,.field input,.field textarea{min-width:0;max-width:100%}
.modal{max-width:100%;overscroll-behavior:contain}
.m-budget>div{min-width:0}
.event-category{display:inline-flex;align-items:center;gap:5px;border-radius:9px;padding:4px 7px;background:#faf4f6;color:#96717f;font-size:11px;font-weight:800}
.event-cost{font-size:11px;color:#917c86;margin-top:7px}
.form-hint{font-size:11px;color:#968991;line-height:1.55}
@media(max-width:420px){.filter-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.row2{grid-template-columns:1fr 1fr}.stats-row{grid-template-columns:1fr}.modal{padding:18px}.m-budget strong{font-size:clamp(13px,4vw,18px)}}
@media(max-width:350px){.row2{grid-template-columns:1fr}.filter-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.tabbar{padding-left:4px;padding-right:4px}}

/* Marriple v13: responsive budget planning */
.budget-hero,.budget-panel{border:1px solid var(--line);border-radius:22px;padding:18px;margin:15px 0;background:#fff;min-width:0}
.budget-hero>strong{display:block;font-size:clamp(22px,6vw,29px);margin:6px 0 14px;letter-spacing:-.04em;overflow-wrap:anywhere}
.budget-top-metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}.budget-top-metrics>div{min-width:0}.budget-top-metrics small{font-size:11px;color:var(--muted);display:block}.budget-top-metrics b{font-size:clamp(12px,3.4vw,16px);overflow-wrap:anywhere}
.budget-track{height:8px;border-radius:20px;background:#f5eef1;margin:12px 0 8px;overflow:hidden}.budget-track i{display:block;height:100%;border-radius:20px;background:#c4a2ae}
.budget-panel h3{margin:0 0 6px;font-size:18px}.budget-panel .row2{margin:14px 0;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.budget-notice{background:#faf6f8;padding:13px;border-radius:14px;font-size:12px;line-height:1.7;color:#756771}.budget-reference{font-size:12px;margin:14px 0;line-height:1.6}
.budget-item{padding:14px 0;border-bottom:1px solid var(--line);min-width:0}.budget-item-top{display:flex;justify-content:space-between;align-items:start;gap:12px;font-size:13px}.budget-item-top>span{font-weight:800;text-align:right;overflow-wrap:anywhere}.budget-item-controls{display:flex;justify-content:space-between;align-items:center;gap:7px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted)}
.budget-item-controls input{width:56px;border:1px solid var(--line);border-radius:9px;padding:5px;text-align:right;color:var(--ink)}.budget-item-controls small{font-size:10px;line-height:1.4}.budget-difference{font-size:11px;color:#7b817e;line-height:1.5}.budget-difference.over,.budget-alert{color:#b26071}.budget-remainder{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0;line-height:1.5;font-size:13px}.budget-remainder strong{text-align:right;overflow-wrap:anywhere}.budget-panel .tool-row .btn{font-size:12px}
.tabbar{grid-template-columns:repeat(6,minmax(0,1fr));padding-left:5px;padding-right:5px;gap:1px}.tab-hit{max-width:52px}.tab .label{font-size:10px;letter-spacing:-.02em}
@media(max-width:360px){.budget-panel{padding:13px}.budget-panel .row2{grid-template-columns:1fr}.tab .label{font-size:9px}.tab-hit{max-width:45px}}

/* v14 · Account / cloud sync */
.account-pill{border:1px solid #eadce2;border-radius:100px;background:#fbf6f8;padding:6px 11px;color:#976c80;font-size:11px;font-weight:750;max-width:154px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.account-pill.logged{background:#edf6f0;color:#4e8067;border-color:#d9ebdf}
.account-card{border:1px solid #f0e5ea;border-radius:20px;background:#fff;padding:16px;margin:12px 0}
.account-card p{font-size:12px;color:#83777e;line-height:1.65;margin:8px 0}
.account-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.account-actions button{font-size:12px;font-weight:750;padding:10px 12px;border-radius:12px;background:#faf2f5;color:#936879;border:1px solid #eddee4}
.account-actions button.main{background:#b998a2;color:#fff}
.account-warning{background:#fffaf0;border:1px solid #eee2cc;padding:12px;border-radius:12px;color:#8a714a;font-size:12px;line-height:1.6}
@media(max-width:360px){.account-pill{max-width:105px;font-size:10px}.status{gap:5px}}

/* v14.1 · Kakao OAuth sign-in */
.kakao-login-button{display:flex;width:100%;align-items:center;justify-content:center;gap:9px;border:0;border-radius:14px;padding:14px 16px;margin:12px 0 9px;background:#FEE500;color:#191919;font-size:14px;font-weight:800;cursor:pointer;min-height:48px}
.kakao-login-button:hover{background:#f6dc00}.kakao-login-button:focus-visible{outline:3px solid #a68798;outline-offset:3px}
.kakao-login-button svg{width:19px;height:19px;flex-shrink:0}.auth-divider{display:flex;gap:12px;align-items:center;color:#95878d;font-size:11px;margin:12px 0}.auth-divider:before,.auth-divider:after{content:'';height:1px;background:#eee5e9;flex:1}

/* Compact expandable contract cards */
.contract-guide{margin:4px 0 15px;color:#a18b96;font-size:12px;line-height:1.5}
.contract-accordion{border:1px solid #f0e4e9;border-radius:20px;background:#fff;margin:0 0 11px;overflow:hidden;box-shadow:0 4px 16px #eacbd313}
.contract-accordion[open]{border-color:#e9cbd7;background:#fffdfd}
.contract-summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:17px 16px;min-width:0;-webkit-tap-highlight-color:transparent}
.contract-summary::-webkit-details-marker{display:none}
.contract-summary:focus-visible{outline:2px solid #d89eaf;outline-offset:-3px}
.contract-main{min-width:0;flex:1;display:flex;flex-direction:column;gap:5px}
.contract-main strong{font-size:15px;line-height:1.4;overflow-wrap:anywhere;color:#463941}
.contract-main small{font-size:11px;color:#9b8791;line-height:1.5;overflow-wrap:anywhere}
.contract-summary-side{display:flex;align-items:center;gap:8px;flex-shrink:0}
.contract-status{font-size:11px;font-weight:800;color:#b06584;background:#fff0f5;border-radius:12px;padding:7px 9px;white-space:nowrap}
.contract-status.done{color:#4f9675;background:#ebf6f0}
.contract-chevron{color:#b98b9e;font-size:24px;line-height:1;transition:transform .2s}
.contract-accordion[open] .contract-chevron{transform:rotate(180deg)}
.contract-detail{border-top:1px solid #f1e6eb;padding:15px 16px 17px;background:#fffafb}
.contract-total-row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:11px;color:#9c8791}
.contract-total-row strong{font-size:13px;color:#8e6175;text-align:right}
.contract-total-row small{font-size:11px;color:#b3a1aa;font-weight:500}
.contract-progress{background:#f3e8ec;height:7px;overflow:hidden;border-radius:99px;margin:10px 0 14px}
.contract-progress span{display:block;height:100%;background:#d995ae;border-radius:99px}
.contract-payment-list{display:grid;gap:8px}
.contract-payment{display:flex;align-items:center;justify-content:space-between;gap:10px;background:white;padding:12px;border:1px solid #f0e5e9;border-radius:14px}
.contract-payment-info{min-width:0;display:flex;flex-direction:column;gap:4px;overflow-wrap:anywhere}
.contract-payment-info strong{font-size:13px;color:#51424b}
.contract-payment-info small{font-size:11px;line-height:1.4;color:#9a8991}
.contract-pay-btn{flex-shrink:0;font-size:11px;font-weight:800;border-radius:11px;padding:9px 10px;background:#fff0f6;color:#ab6581}
.contract-add-btn{width:100%;text-align:center;margin-top:12px;padding:12px;border:1px dashed #e8bcca;border-radius:13px;color:#ad6e89;background:#fff;font-size:12px;font-weight:800}
@media(max-width:370px){.contract-summary{padding:14px 12px}.contract-status{font-size:10px;padding:6px}.contract-payment{padding:10px}.contract-pay-btn{padding:8px;font-size:10px}}

/* Marriple app launch splash: temporary presentation, never blocks data loading */
#marripleSplash{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;padding:24px;background:linear-gradient(160deg,#ffffff 5%,#fff6f9 76%,#ffedf4 100%);transition:opacity .42s ease,visibility .42s ease;overflow:hidden}
#marripleSplash.splash-hide{opacity:0;visibility:hidden;pointer-events:none}
.splash-content{text-align:center;width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;animation:splash-rise .65s ease both}
.splash-mark{width:88px;height:88px;border-radius:29px;display:grid;place-items:center;background:#fff;box-shadow:0 14px 40px #da9eb23b;border:1px solid #fbe2ea;position:relative}
.splash-mark svg{width:56px;height:56px;overflow:visible}
.splash-word{margin:20px 0 5px;font-size:40px;font-family:Georgia,'Times New Roman',serif;font-weight:700;letter-spacing:-1.7px;color:#a76d82;line-height:1.2}
.splash-tag{font-size:13px;letter-spacing:.01em;color:#997f8b;font-weight:500}
.splash-dots{display:flex;gap:7px;justify-content:center;margin-top:36px}
.splash-dots span{width:6px;height:6px;border-radius:50%;background:#dfadc0;animation:splash-dot 1.1s ease-in-out infinite}
.splash-dots span:nth-child(2){animation-delay:.17s}.splash-dots span:nth-child(3){animation-delay:.34s}
.splash-foot{position:absolute;bottom:max(24px,env(safe-area-inset-bottom));font-size:11px;color:#baa1ab;letter-spacing:.09em}
@keyframes splash-rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes splash-dot{0%,65%,100%{opacity:.35;transform:scale(.8)}30%{opacity:1;transform:scale(1.15)}}
@media(prefers-reduced-motion:reduce){.splash-content,.splash-dots span{animation:none!important}#marripleSplash{transition:none}}


/* v15 · QC fixes */
.budget-remainder strong{white-space:nowrap;flex-shrink:0}.budget-remainder>div{min-width:0}
.budget-panel h4{margin:20px 0 10px;font-size:14px;color:#4d4248}
.frame{grid-template-columns:minmax(0,410px);justify-content:center}
.row-actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;margin-top:10px}
.mini-btn{font-size:11px;font-weight:800;border-radius:10px;padding:7px 10px;background:#faf4f7;color:#8c5f72;border:1px solid #efe2e8}
.mini-btn.danger{color:#a8495a;background:#fff6f7;border-color:#f3d9dd}
.sample-banner{border:1px dashed #e3c3cf;background:#fffafc;border-radius:16px;padding:13px 14px;font-size:12px;line-height:1.6;color:#6d5a63;margin:0 0 16px}
.sample-banner .row-actions{justify-content:flex-start;margin-top:8px}
.m-days{border:0;cursor:pointer}
.qc-note{font-size:11px;color:var(--muted);line-height:1.55;margin-top:8px}
.qc-warn{font-size:11px;color:#a8495a;background:#fff6f7;border-radius:10px;padding:8px 10px;line-height:1.5;margin:0 0 10px}
.expense-meta{display:block;margin-top:5px;color:var(--muted);font-size:12px}
</style>
</head>

async function authKakaoLogin(){
  if(!ensureAuth())return;
  try{
    const redirectTo=MARRIPLE_AUTH_REDIRECT;
    const {error}=await authClient.auth.signInWithOAuth({provider:'kakao',options:{redirectTo}});
    if(error)throw error;
  }catch(err){alert('카카오 로그인 연결 실패: '+(err?.message||'카카오 개발자 설정을 확인해 주세요.'));}
}
function ensureAuth(){if(!authClient){alert('로그인 서버 연결 전입니다. Supabase URL 및 공개 키를 설정해 주세요.');return false;}return true;}
async function authPasswordAction(kind){
 if(!ensureAuth())return;
 const email=document.getElementById('authEmail')?.value.trim(),password=document.getElementById('authPassword')?.value||'';
 if(!email||password.length<8){alert('이메일과 8자 이상 비밀번호를 입력해 주세요.');return;}
 try{
 const result=kind==='signup'?await authClient.auth.signUp({email,password,options:{emailRedirectTo:MARRIPLE_AUTH_REDIRECT}}):await authClient.auth.signInWithPassword({email,password});
 if(result.error)throw result.error;
 if(kind==='signup'&&!result.data.session){alert('가입 신청이 완료됐어요. 이메일 인증을 마친 뒤 로그인해 주세요.');closeModal();return;}
 closeModal();toast(kind==='signup'?'회원가입 완료':'로그인 완료');
 }catch(err){alert('인증 실패: '+(err.message||'다시 시도해 주세요.'));}
}
async function authResetPassword(){if(!ensureAuth())return;const email=document.getElementById('authEmail')?.value.trim();if(!email){alert('이메일을 입력해 주세요.');return;}try{const {error}=await authClient.auth.resetPasswordForEmail(email,{redirectTo:MARRIPLE_AUTH_REDIRECT});if(error)throw error;alert('비밀번호 변경 이메일을 보냈어요.');}catch(e){alert(e.message);}}
async function initAuth(){
 if(!cloudConfigured())return;
 if(!window.supabase?.createClient){console.warn('Supabase SDK 로딩 실패');return;}
 authClient=window.supabase.createClient(MARRIPLE_SUPABASE_URL,MARRIPLE_SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 const {data:{session}}=await authClient.auth.getSession();
 if(session?.user)await useAccount(session.user);sessionInitialized=true;
 authClient.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_IN'&&session?.user&&authUser?.id!==session.user.id)queueMicrotask(()=>useAccount(session.user));if(event==='SIGNED_OUT')queueMicrotask(()=>resetGuest());});
 render();
}
function resetGuest(){authUser=null;cloudEnabled=false;clearTimeout(cloudTimer);state=load();render();toast('로그아웃했어요. 게스트 데이터는 따로 보관됩니다.');}
let cloudRev=null,cloudConflict=false,cloudDirty=false;
async function useAccount(user){
 if(authUser?.id===user.id)return;
 clearTimeout(cloudTimer);authUser=user;cloudEnabled=false;cloudConflict=false;cloudRev=null;cloudDirty=false;
 let cached=null;try{cached=JSON.parse(storage.getItem(accountKey(user.id))||'null')}catch(e){}
 state={...freshAccount(),...(cached||{})};state.current='home';render();
 try{
 const {data,error}=await authClient.from('wedding_data').select('data').eq('user_id',user.id).maybeSingle();
 if(error)throw error;
 if(data?.data){applyCloud(data.data);toast('계정의 웨딩 데이터를 불러왔어요.');}
 else{cloudEnabled=true;render();toast('새 계정이에요. 기존 게스트 자료를 가져오거나 새로 시작할 수 있어요.');}
 }catch(e){console.error(e);toast('클라우드 조회 실패 · 현재 기기 자료만 표시됩니다.');}
}
function applyCloud(d){const {_rev,...rest}=d||{};state={...freshAccount(),...rest,current:'home'};cloudRev=_rev||null;cloudDirty=false;cloudConflict=false;storage.setItem(accountKey(authUser.id),JSON.stringify(state));cloudEnabled=true;render();}
function accountDataToStore(rev){return {...cleanSharedState(state),_rev:rev}}
async function remoteRev(){const {data,error}=await authClient.from('wedding_data').select('data').eq('user_id',authUser.id).maybeSingle();if(error)throw error;return data?.data?{rev:data.data._rev||'legacy',data:data.data}:{rev:null,data:null};}
// Writes only when the cloud copy is still the one this device last saw, so a partner's edits are never silently overwritten.
async function cloudWrite(force=false){
 if(!force){const r=await remoteRev();if(r.rev!==cloudRev){cloudConflict=true;cloudEnabled=false;render();showConflict();return false;}}
 const rev=uid();
 const {error}=await authClient.from('wedding_data').upsert({user_id:authUser.id,data:accountDataToStore(rev),updated_at:new Date().toISOString()},{onConflict:'user_id'});
 if(error)throw error;cloudRev=rev;cloudDirty=false;cloudConflict=false;cloudEnabled=true;return true;
}
function showConflict(){modal('다른 기기에서 먼저 저장했어요','같은 계정의 다른 기기(파트너 폰 등)에서 클라우드 데이터가 바뀌었어요. 덮어쓰지 않도록 자동 저장을 잠시 멈췄어요.',`<div class="account-actions"><button class="main" onclick="closeModal();cloudReload()">클라우드 내용 불러오기</button><button onclick="cloudOverwrite()">이 기기 내용으로 덮어쓰기</button></div><p class="qc-note">불러오면 이 기기에서 아직 저장되지 않은 변경은 사라져요. 필요하면 먼저 '우리 둘 › 내보내기'로 CSV를 받아두세요.</p>`);}
async function cloudReload(){try{const r=await remoteRev();if(!r.data){alert('클라우드에 저장된 데이터가 없어요.');return;}applyCloud(r.data);toast('클라우드 내용으로 맞췄어요');}catch(e){alert('불러오기 실패: '+e.message);}}
async function cloudOverwrite(){if(!confirm('다른 기기에서 저장한 내용을 이 기기 내용으로 덮어쓸까요? 되돌릴 수 없어요.'))return;try{await cloudWrite(true);closeModal();render();toast('이 기기 내용으로 저장했어요');}catch(e){alert('저장 실패: '+e.message);}}
async function cloudSaveNow(){
 if(!authUser||!authClient){openAuthModal();return;}
 try{if(await cloudWrite(false)){render();toast('클라우드 저장 완료');}}catch(e){alert('클라우드 저장 실패: '+e.message);}
}
async function cloudRestorePrompt(){
 if(!authUser)return;
 if(!confirm('클라우드 데이터로 현재 화면의 계정 데이터를 교체할까요? (계정의 기기 데이터는 바뀔 수 있어요)'))return;
 await cloudReload();
}
function openGuestImport(){
 if(!authUser){openAuthModal();return;}
 const data=storage.getItem(STORE);
 if(!data)return alert('이 브라우저에서 가져올 게스트 데이터가 없어요.');
 if(!confirm('기존 게스트 데이터를 현재 계정으로 가져올까요? 기존 계정 일정과 지출을 교체합니다.'))return;
 try{state={...freshAccount(),...JSON.parse(data),current:'home',isSample:false};storage.setItem(accountKey(authUser.id),JSON.stringify(state));render();cloudWrite(true).then(()=>{render();toast('게스트 자료를 계정에 저장했어요')}).catch(e=>alert('클라우드 저장 실패: '+e.message));}catch(e){alert('가져오기 실패: '+e.message)}
}
async function authSignOut(){if(!authClient)return;const {error}=await authClient.auth.signOut();if(error)alert(error.message);else resetGuest();}
function scheduleCloudSave(){
 if(!cloudEnabled||!authUser||!authClient)return;
 clearTimeout(cloudTimer);cloudTimer=setTimeout(async()=>{
 if(!authUser||!cloudEnabled)return;
 try{await cloudWrite(false);}
 catch(e){console.warn('자동 동기화 실패',e);toast('클라우드 자동 저장 실패 · 기기에는 저장됨');}
 },800);
}
// When the app comes back to the foreground, pick up the partner's changes if this device has nothing unsaved.
document.addEventListener('visibilitychange',async()=>{
 if(document.visibilityState!=='visible'||!authUser||!authClient||cloudConflict)return;
 try{const r=await remoteRev();if(r.data&&r.rev!==cloudRev){if(cloudDirty){cloudConflict=true;cloudEnabled=false;render();showConflict();}else{applyCloud(r.data);toast('다른 기기의 변경 내용을 불러왔어요');}}}catch(e){console.warn(e)}
});

let state=load();
function load(){
  const raw=storage.getItem(STORE);
  if(!raw) return {...defaults(), isSample:true};
  try{ return {...defaults(), ...JSON.parse(raw)}; }
  catch(e){ try{storage.setItem(STORE+'-corrupt-backup-'+Date.now(), raw)}catch(_){} return {...defaults(), isSample:true}; }
}
function save(){ storage.setItem(authUser?accountKey(authUser.id):STORE, JSON.stringify(state)); if(authUser)cloudDirty=true; scheduleCloudSave(); }
function allPayments(){ return state.contracts.flatMap(c=>c.payments.map(p=>({...p, vendor:c.vendor, category:c.category, contractId:c.id, remaining:p.amount-p.paid}))); }
function totalContract(){ return state.contracts.reduce((s,c)=>s+c.total,0); }
// Single source of truth: every screen reads its totals from here.
function financeSummary(){
  const pays=allPayments();
  const contractTotal=totalContract();
  const contractPaid=pays.reduce((s,p)=>s+(Number(p.paid)||0),0);
  const contractRemaining=pays.reduce((s,p)=>s+Math.max(0,(Number(p.amount)||0)-(Number(p.paid)||0)),0);
  const expenseTotal=state.expenses.reduce((s,e)=>s+(Number(e.amount)||0),0);
  return {contractTotal,contractPaid,contractRemaining,expenseTotal,spent:contractPaid+expenseTotal};
}
function totalPaid(){ return financeSummary().spent; }
const who=k=>k==='파트너'?(state.names?.[1]||'파트너'):(state.names?.[0]||'나');

function payerTotals(){
  const t={'나':0,'파트너':0,'미지정':0};
  state.expenses.forEach(e=>{t[e.payer==='파트너'?'파트너':'나']+=Number(e.amount)||0});
  state.contracts.forEach(c=>(c.payments||[]).forEach(p=>{let covered=0;(p.transactions||[]).forEach(x=>{const a=Number(x.amount)||0;covered+=a;t[x.payer==='파트너'?'파트너':x.payer==='나'?'나':'미지정']+=a});const rest=(Number(p.paid)||0)-covered;if(rest>0)t['미지정']+=rest;}));
  return t;
}

function normalizeCategory(cat){return LEGACY_CATEGORY_MAP[cat]|| (CATEGORY_NAMES.includes(cat)?cat:'기타')}
function inferEventCategory(e){
 if(e.category)return normalizeCategory(e.category);
 const t=(e.title||'')+' '+(e.place||'');
 const rules=[['상견례',/상견례/],['웨딩홀',/웨딩홀|예식장|홀투어/],['모바일 청첩장',/모바일.?청첩장/],['청첩장',/청첩장/],['스튜디오',/스튜디오|사진.?셀렉|웨딩.?촬영/],['드레스',/드레스/],['네일',/네일|페디/],['피부·에스테틱',/피부|에스테틱|마사지/],['헤어·미용실',/미용실|헤어|염색/],['메이크업',/메이크업/],['한복',/한복/],['예복·정장',/예복|정장|턱시도/],['신혼여행',/신혼여행|허니문/],['예물·반지',/예물|반지/],['스냅·영상',/스냅|영상/],['본식·연출',/사회자|주례|축가|입장곡|퇴장곡|행진곡|화촉점화|혼인서약|성혼선언|식순|음향|본식.?음악|식전.?음악|리허설/],['신혼집',/신혼집|이사/]];
 return (rules.find(([,re])=>re.test(t))||[])[0] || (e.type==='모임'?'청첩장':'기타');
}

function go(tab){
  const changed=state.current!==tab;
  state.current=tab;
  save();
  render();
  // A tab change is a new screen, not a continuation of the prior scroll position.
  if(changed){
    window.scrollTo({top:0,left:0,behavior:'instant'});
    document.documentElement.scrollTop=0;
    document.body.scrollTop=0;
    const screen=document.querySelector('.screen');
    if(screen) screen.scrollTop=0;
  }
}

function modal(title,desc,body,submit=''){
  document.getElementById('modalroot').innerHTML=`<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><h3>${title}</h3><p>${desc}</p></div><button class="btn white" onclick="closeModal()">닫기</button></div><div>${body}</div>${submit?`<div class="footer"><button class="btn white" onclick="closeModal()">취소</button><button class="btn primary" onclick="${submit}">저장</button></div>`:''}</div></div>`;
  initModalEnhancements(document.getElementById('modalroot'));
}
function closeModal(){ document.getElementById('modalroot').innerHTML=''; }

  modal('새 계약 등록','총액과 분할 결제를 함께 등록해요.',`
    <div class="fields">

      <div class="row2"><div class="field"><label>카테고리</label><select id="category">${categoryOptions("웨딩홀")}</select></div><div class="field"><label>계약 총액</label><input id="total" type="text" inputmode="numeric" data-money="true" placeholder="12,000,000"><div class="money-preview" id="totalPreview">금액을 입력하면 콤마로 보여드릴게요.</div></div></div>
      <div class="field"><label>계약일</label><input id="contractDate" type="date" value="${dayKey(new Date())}"></div>

      <div class="row2"><div class="field"><label>1차 예정일</label><input id="p1date" type="date" value="${dayKey(new Date())}"></div><div class="field"><label>2차 예정일</label><input id="p2date" type="date" value="${plusDays(dayKey(new Date()),30)}"></div></div>
      <div class="field"><label>2차 결제명</label><input id="p2name" value="잔금"></div><div class="small muted">중도금 추가와 지급수단·비고 입력은 계약 등록 후 각 회차 상세에서 이용할 수 있어요.</div>

function openExpense(id){
  const e=id?state.expenses.find(x=>x.id===id):null;
  if(id&&!e)return;
  modal(e?'지출 수정':'지출 기록',e?'잘못 입력한 금액이나 항목을 고칠 수 있어요.':'금액과 항목만 입력하면 나머지는 기본값으로 저장돼요.',`
  <div class="fields">
    <div class="field"><label>지출 항목</label><input id="expenseName" value="${esc(e?.name||'')}" placeholder="예: 친구 청첩장 모임"></div>
    <div class="row2"><div class="field"><label>카테고리</label><select id="expenseCat">${categoryOptions(e?.category||"청첩장")}</select></div><div class="field"><label>금액</label><input id="expenseAmount" type="text" inputmode="numeric" data-money="true" value="${e?e.amount:''}" placeholder="50,000"><div class="money-preview" id="expenseAmountPreview">금액을 입력하면 콤마로 보여드릴게요.</div></div></div>
    <div class="row2"><div class="field"><label>결제일</label><input id="expenseDate" type="date" value="${esc(e?.date||dayKey(new Date()))}"></div><div class="field"><label>결제자</label><select id="payer">${payerOptions(e?.payer==='파트너'?'파트너':'나')}</select></div></div>
  </div>`,`createExpense('${e?e.id:''}')`);
}
function deleteExpense(id){
  const e=state.expenses.find(x=>x.id===id);if(!e)return;
  if(!confirm(`'${e.name}' ${fmtMoney(e.amount)} 지출을 삭제할까요?`))return;
  state.expenses=state.expenses.filter(x=>x.id!==id);
  state.events.forEach(ev=>{if(ev.expenseId===id)ev.expenseId=''});
  save();render();toast('지출을 삭제했어요');
}
function openEvent(id){
  const e=id?state.events.find(x=>x.id===id):null;
  if(id&&!e)return;
  const cat=e?inferEventCategory(e):'상견례', act=e?eventAction(e):'';
  const explicitUrl=e&&e.placeUrl&&e.placeUrl!==defaultPlaceLink(e.place,e.address)?e.placeUrl:'';
  modal(e?'일정 수정':'새 일정 등록',e?'날짜·장소·내용을 고칠 수 있어요.':'분야와 세부 행동을 선택하고, 필요한 비용도 함께 기록해요.',`
    <div class="fields">
      <div class="row2"><div class="field"><label>준비 카테고리</label><select id="eventCategory" onchange="refreshEventActions()">${categoryOptions(cat)}</select></div><div class="field"><label>세부 행동</label><select id="eventAction" onchange="autoEventTitle()">${actionOptions(cat,act)}</select></div></div>
      <div class="field"><label>일정 제목</label><input id="eventTitle" value="${esc(e?.title||'')}" ${e?'data-edited="yes"':''} placeholder="예: 상견례 장소 예약" oninput="this.dataset.edited='yes'"></div>
      <div class="field"><label>일정 날짜</label><input id="eventDate" type="date" value="${esc(e?.date||state.selectedDate||dayKey(new Date()))}"></div>
      <div class="field"><label>장소 / 업체명 (선택)</label><input id="eventPlace" value="${esc(e?.place||'')}" placeholder="예: 본궁석갈비" oninput="updatePreview()"></div>
      <div class="field"><label>지역 또는 주소 (선택)</label><input id="eventAddress" value="${esc(e?.address||'')}" placeholder="예: 충북 청주시 · 정확한 주소도 가능" oninput="updatePreview()"></div>
      <div class="preview-place location-preview" id="placePreview"><span class="pin">📍</span><div><strong>장소를 입력해 주세요</strong><small>입력한 장소를 일정에 저장해요.</small></div></div>
      <div class="location-help">✅ 지도를 따로 열거나 링크를 복사할 필요 없어요. 일정 저장 후 <b>지도에서 보기</b>를 누르면 네이버 지도 검색 결과가 열려요.</div>
      <details class="location-advanced" ${explicitUrl?'open':''}><summary>정확한 네이버 지도 링크가 있다면 직접 등록 (선택)</summary><div class="field"><label>공유 링크</label><input id="eventPlaceUrl" type="url" value="${esc(explicitUrl)}" placeholder="https://map.naver.com/..." oninput="updatePreview()"></div><div class="location-help">동명이인 장소를 구별하고 싶을 때만 사용해 주세요. 입력하지 않아도 저장할 수 있어요.</div></details>
      <div class="field"><label>기존 계약과 연결 (선택)</label><select id="eventContract"><option value="">연결 안 함</option>${state.contracts.map(c=>`<option value="${esc(c.id)}" ${e?.contractId===c.id?'selected':''}>${esc(c.vendor)} · ${esc(c.category)}</option>`).join('')}</select></div>
      ${e?`<div class="form-hint">${e.expenseId?'연결된 지출 금액은 가계부 › 지출 내역에서 수정할 수 있어요.':'일정 수정에서는 지출을 새로 만들지 않아요. 필요하면 가계부에서 지출을 기록해 주세요.'}</div>`:`<div class="row2"><div class="field"><label>관련 지출 (선택, 원)</label><input id="eventExpenseAmount" type="text" inputmode="numeric" data-money="true" placeholder="예: 50,000"><div class="money-preview" id="eventExpenseAmountPreview">금액을 입력하면 콤마로 보여드릴게요.</div></div><div class="field"><label>결제자</label><select id="eventExpensePayer">${payerOptions('나')}</select></div></div>
      <div class="form-hint">금액을 입력하면 가계부에도 같은 날짜로 지출이 자동 등록됩니다. 계약에 이미 반영된 금액은 중복 집계되지 않도록 여기에는 입력하지 마세요.</div>`}
    </div>`,`saveEvent('${e?e.id:''}')`);
  if(!e)autoEventTitle();updatePreview();
}
function updatePreview(){
 const name=v('eventPlace'),addr=v('eventAddress'),explicit=safePlaceUrl(v('eventPlaceUrl'));
 const el=document.getElementById('placePreview'); if(!el)return;
 const label=name||addr||'장소 미입력';
 const sub=explicit?'직접 등록한 지도 링크를 사용할게요.':(name||addr?'저장하면 일정에서 네이버 지도 검색을 열 수 있어요.':'장소는 나중에 입력해도 괜찮아요.');
 el.innerHTML=`<span class="pin">📍</span><div><strong>${esc(label)}</strong>${name&&addr?`<small>${esc(addr)}</small>`:''}<small>${sub}</small></div>`;
}
function v(id){ return document.getElementById(id)?.value?.trim()||''; }
function createContract(){ const vendor=v('vendor'); const total=moneyNumber('total'); const p1amt=moneyNumber('p1amount'); const d1=v('p1date'), d2=v('p2date'); if(!vendor||!Number.isFinite(total)||total<=0||!Number.isFinite(p1amt)||p1amt<0||p1amt>total){ return alert('계약 정보를 확인해 주세요.'); } if(!d1||!d2) return alert('결제 예정일을 모두 입력해 주세요.'); if(d2<d1) return alert('2차 예정일이 1차 예정일보다 빠를 수 없어요.'); const pays=[{id:uid(), name:v('p1name')||'계약금', amount:p1amt, date:d1, paid:0}]; if(total-p1amt>0) pays.push({id:uid(), name:v('p2name')||'잔금', amount:total-p1amt, date:d2, paid:0}); state.contracts.push({id:uid(), vendor, category:v('category'), total, contractDate:v('contractDate'), payments:pays}); save(); closeModal(); state.current='contracts'; render(); toast('계약을 추가했어요'); }
function createExpense(id){ const name=v('expenseName'); const amt=moneyNumber('expenseAmount'); const date=v('expenseDate'); if(!name||!Number.isFinite(amt)||amt<=0) return alert('지출 정보를 확인해 주세요.'); if(!date) return alert('결제일을 입력해 주세요.'); const data={name, category:v('expenseCat'), amount:amt, date, payer:v('payer')||'나'}; if(id){ const e=state.expenses.find(x=>x.id===id); if(!e)return; Object.assign(e,data); } else state.expenses.push({id:uid(),...data}); save(); closeModal(); state.current='finance'; render(); toast(id?'지출을 수정했어요':'지출을 기록했어요'); }
function saveEvent(editId){ const title=v('eventTitle'),cat=normalizeCategory(v('eventCategory')),action=v('eventAction'),date=v('eventDate'),place=v('eventPlace'),address=v('eventAddress');if(!title||!date)return alert('일정 제목과 날짜를 입력해 주세요.');const placeUrl=safePlaceUrl(v('eventPlaceUrl'))||defaultPlaceLink(place,address);const contractId=v('eventContract');
 if(editId){const e=state.events.find(x=>x.id===editId);if(!e)return;Object.assign(e,{title,date,category:cat,action,type:action,place,address,placeUrl,contractId});const linked=state.expenses.find(x=>x.id===e.expenseId);if(linked&&linked.date!==date&&confirm('연결된 지출 날짜도 '+date+'로 바꿀까요?'))linked.date=date;save();closeModal();state.selectedDate=date;state.current='calendar';save();render();toast('일정을 수정했어요');return;}
 const amt=moneyNumber('eventExpenseAmount');if(!Number.isFinite(amt)||amt<0)return alert('지출 금액을 확인해 주세요.');const id=uid();let expenseId='';if(amt>0){expenseId=uid();state.expenses.push({id:expenseId,eventId:id,name:title+' · '+action,category:cat,amount:amt,date,payer:v('eventExpensePayer')||'나'});}state.events.push({id,title,date,category:cat,action,type:action,place,address,placeUrl,contractId,expenseId});save();closeModal();state.current='calendar';state.calendarFilter='전체';state.selectedDate=date;save();render();toast(amt>0?'일정과 지출을 함께 저장했어요':'일정을 추가했어요');}
function removeEvent(id){const e=state.events.find(e=>e.id===id);if(!e)return;if(!confirm(e.expenseId?'일정을 삭제할까요? 연결된 지출은 가계부에 보존됩니다.':'이 일정을 삭제할까요?'))return;state.events=state.events.filter(x=>x.id!==id);save();render();}

function secureUrl(u){try{const x=new URL(String(u||'').trim());return x.protocol==='https:'?x.href:''}catch(e){return ''}}
function invitationPanel(){const i=state.invitation||{};const url=secureUrl(i.url);return `<div class="section"><div class="section-head"><h3>💌 모바일 청첩장</h3><span class="small muted">링크 보관함</span></div><div class="link-vault"><div class="link-vault-row"><div class="vault-icon">💌</div><div class="todo-main"><strong>${escapeHtml(i.title||'우리의 모바일 청첩장')}</strong><small>${url?'링크 저장 완료 · 클릭 한 번으로 공유':'청첩장 URL을 한 번만 저장해두세요'}</small></div></div><div class="link-vault-actions"><button onclick="editInvitation()">${url?'링크 수정':'링크 등록'}</button>${url?`<button onclick="openInvitation()">링크 열기</button><button class="primary-action" onclick="shareInvitation()">↗ 바로 공유</button>`:''}</div></div></div>`}
function editInvitation(){const i=state.invitation||{};modal('모바일 청첩장 저장','청첩장 제작 기능 없이 링크만 보관해요.',`<div class="fields"><div class="field"><label>표시 이름</label><input id="inv-title" value="${escapeHtml(i.title||'우리의 모바일 청첩장')}" placeholder="우리의 모바일 청첩장"></div><div class="field"><label>모바일 청첩장 https 링크</label><input id="inv-url" type="url" value="${escapeHtml(i.url||'')}" placeholder="https://..."></div><div class="small muted">신뢰할 수 있는 청첩장 링크를 등록해 주세요.</div></div>`,'saveInvitation()')}
function saveInvitation(){const raw=v('inv-url'),url=secureUrl(raw);if(raw&&!url)return alert('https://로 시작하는 청첩장 링크를 입력해 주세요.');state.invitation={title:v('inv-title')||'우리의 모바일 청첩장',url};save();closeModal();render();toast('청첩장 링크 저장 완료')}
function openInvitation(){const url=secureUrl(state.invitation?.url);if(url)window.open(url,'_blank','noopener,noreferrer')}
async function shareInvitation(){const url=secureUrl(state.invitation?.url);if(!url)return;try{if(navigator.share){await navigator.share({title:state.invitation.title||'모바일 청첩장',url});return}if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(url);toast('청첩장 링크를 복사했어요');return}prompt('아래 링크를 복사해 공유하세요.',url)}catch(e){if(e.name!=='AbortError')prompt('아래 링크를 복사해 공유하세요.',url)}}

function addInstallment(id){const c=state.contracts.find(x=>x.id===id);if(!c)return;const allocated=c.payments.reduce((s,p)=>s+p.amount,0);modal('결제 회차 추가','새 중도금·잔금 회차를 추가할 수 있어요.',`<div class="fields"><div class="field"><label>회차 이름</label><input id="extraName" placeholder="예: 2차 중도금"></div><div class="field"><label>예정 금액</label><input id="extraAmount" type="text" inputmode="numeric" data-money="true" placeholder="예: 300,000"><div class="money-preview" id="extraAmountPreview">금액을 입력하면 콤마로 보여드릴게요.</div></div><div class="field"><label>지급 예정일</label><input id="extraDate" type="date" value="${dayKey(new Date())}"></div><div class="small muted">현재 배분액 ${fmtMoney(allocated)} / 총 계약액 ${fmtMoney(c.total)}. 추가 회차 금액은 기존 미지급 잔금에서 자동으로 분리됩니다.</div></div>`,`saveInstallment('${id}')`)}
function saveInstallment(id){const c=state.contracts.find(x=>x.id===id);if(!c)return;const n=moneyNumber('extraAmount');const allocated=c.payments.reduce((s,p)=>s+p.amount,0);const source=[...c.payments].reverse().find(p=>p.name.includes('잔금')&&p.amount-p.paid>=n)||[...c.payments].reverse().find(p=>p.amount-p.paid>=n);if(!Number.isFinite(n)||n<=0||!source)return alert('분리할 수 있는 미지급 잔액이 부족합니다.');if(!v('extraDate'))return alert('지급 예정일을 입력해 주세요.');source.amount-=n;c.payments.push({id:uid(),name:v('extraName')||'추가 중도금',date:v('extraDate'),amount:n,paid:0,transactions:[]});save();closeModal();render()}

function paymentMethodLabel(p){const t=p.transactions||[];return t.length?[...new Set(t.map(x=>x.method||'기타'))].join(' · '):p.method||'결제수단 미입력'}
function showPayment(contractId,payId){const c=state.contracts.find(x=>x.id===contractId),p=c?.payments.find(x=>x.id===payId);if(!p)return;let history=(p.transactions||[]).map(t=>`<div class="payment-entry"><div class="pay-row"><strong>${escapeHtml(t.method||'기타')} · ${fmtMoney(t.amount)}</strong><span>${escapeHtml(t.date||'')}</span></div><div class="small muted" style="margin-top:4px">결제자: ${t.payer?esc(who(t.payer)):'미지정'}</div><div class="payment-detail">${escapeHtml(t.memo||'메모 없음')}</div><div class="row-actions"><button class="mini-btn danger" onclick="deleteTransaction('${c.id}','${p.id}','${t.id}')">이 지급 기록 삭제</button></div></div>`).join('');const untracked=(Number(p.paid)||0)-(p.transactions||[]).reduce((s,t)=>s+(Number(t.amount)||0),0);modal(escapeHtml(c.vendor)+' · '+escapeHtml(p.name),'결제수단과 메모는 지급 기록마다 저장됩니다.',`<div class="payment-detail"><b>예정일</b> ${esc(p.date||'날짜 미정')}<div><b>예정 금액</b> ${fmtMoney(p.amount)}　<b>지급 완료</b> ${fmtMoney(p.paid)}</div><div><b>미지급</b> ${fmtMoney(Math.max(0,p.amount-p.paid))}</div></div><div class="row-actions"><button class="mini-btn" onclick="openRoundEdit('${c.id}','${p.id}')">회차 수정</button><button class="mini-btn danger" onclick="deleteRound('${c.id}','${p.id}')">회차 삭제</button></div><h4>결제 내역</h4>${history||'<p class="small muted">아직 지급 내역이 없어요.</p>'}${untracked>0?`<div class="payment-entry"><div class="pay-row"><strong>이전 버전 지급 기록 · ${fmtMoney(untracked)}</strong></div><div class="row-actions"><button class="mini-btn danger" onclick="resetUntracked('${c.id}','${p.id}')">지급 취소</button></div></div>`:''}${p.amount>p.paid?`<button class="btn primary" onclick="openPaymentEntry('${c.id}','${p.id}')">＋ 지급 내역 추가</button>`:''}`)}
function openPaymentEntry(contractId,payId){const c=state.contracts.find(x=>x.id===contractId),p=c?.payments.find(x=>x.id===payId);if(!p)return;const balance=Math.max(0,p.amount-p.paid);modal('지급 내역 추가',escapeHtml(c.vendor)+' · '+escapeHtml(p.name),`<div class="fields"><div class="field"><label>지급 금액</label><input id="paymentAmount" type="text" inputmode="numeric" data-money="true" value="${balance}"><div class="money-preview" id="paymentAmountPreview">금액을 입력하면 콤마로 보여드릴게요.</div></div><div class="row2"><div class="field"><label>결제수단</label><select id="paymentMethod"><option>계좌이체</option><option>카드</option><option>현금</option><option>기타</option></select></div><div class="field"><label>결제자</label><select id="paymentPayer">${payerOptions('나')}</select></div></div><div class="field"><label>지급일</label><input id="paymentDate" type="date" value="${dayKey(new Date())}"></div><div class="field"><label>결제 메모 · 선택</label><textarea id="paymentMemo" rows="3" placeholder="예: 카드 일시불 / 이체 완료 문자 확인"></textarea></div><p class="small muted">⚠️ 계좌번호·카드번호 같은 민감한 정보는 적지 마세요. ${authUser?'로그인 상태라 이 메모는 클라우드에도 저장돼요.':'메모는 이 기기에 암호화되지 않은 상태로 저장돼요.'}</p></div>` ,`savePaymentEntry('${contractId}','${payId}')`)}
function savePaymentEntry(contractId,payId){const c=state.contracts.find(x=>x.id===contractId),p=c?.payments.find(x=>x.id===payId);if(!p)return;const n=moneyNumber('paymentAmount'),balance=p.amount-p.paid;if(!Number.isFinite(n)||n<=0||n>balance)return alert('남은 금액 이하로 입력해 주세요.');if(!v('paymentDate'))return alert('지급일을 입력해 주세요.');p.transactions=p.transactions||[];p.transactions.push({id:uid(),amount:n,method:v('paymentMethod'),payer:v('paymentPayer')||'나',date:v('paymentDate'),memo:v('paymentMemo')});p.paid+=n;save();closeModal();render();toast(fmtMoney(n)+' 지급을 기록했어요')}
function deleteTransaction(cid,pid,tid){const c=state.contracts.find(x=>x.id===cid),p=c?.payments.find(x=>x.id===pid),t=p?.transactions?.find(x=>x.id===tid);if(!t)return;if(!confirm(`${fmtMoney(t.amount)} 지급 기록을 삭제할까요? 미지급 금액이 다시 늘어나요.`))return;p.transactions=p.transactions.filter(x=>x.id!==tid);p.paid=Math.max(0,(Number(p.paid)||0)-(Number(t.amount)||0));save();render();showPayment(cid,pid);toast('지급 기록을 삭제했어요')}
function resetUntracked(cid,pid){const c=state.contracts.find(x=>x.id===cid),p=c?.payments.find(x=>x.id===pid);if(!p)return;const tracked=(p.transactions||[]).reduce((s,t)=>s+(Number(t.amount)||0),0);if(!confirm('이전 버전에서 기록한 지급 '+fmtMoney(p.paid-tracked)+'을 취소할까요?'))return;p.paid=tracked;save();render();showPayment(cid,pid)}
function openRoundEdit(cid,pid){const c=state.contracts.find(x=>x.id===cid),p=c?.payments.find(x=>x.id===pid);if(!p)return;modal('결제 회차 수정',escapeHtml(c.vendor)+' · '+escapeHtml(p.name),`<div class="fields"><div class="field"><label>회차 이름</label><input id="roundName" value="${esc(p.name)}"></div><div class="field"><label>예정 금액</label><input id="roundAmount" type="text" inputmode="numeric" data-money="true" value="${p.amount}"><div class="money-preview" id="roundAmountPreview"></div></div><div class="field"><label>지급 예정일</label><input id="roundDate" type="date" value="${esc(p.date||'')}"></div><p class="small muted">회차 금액을 바꾸면 계약 총액도 같은 만큼 바뀌어요. 이미 낸 금액(${fmtMoney(p.paid)})보다 작게는 바꿀 수 없어요.</p></div>`,`saveRoundEdit('${cid}','${pid}')`)}
function saveRoundEdit(cid,pid){const c=state.contracts.find(x=>x.id===cid),p=c?.payments.find(x=>x.id===pid);if(!p)return;const n=moneyNumber('roundAmount'),date=v('roundDate');if(!Number.isFinite(n)||n<=0||n<p.paid)return alert('이미 낸 금액 이상으로 입력해 주세요.');if(!date)return alert('지급 예정일을 입력해 주세요.');const diff=n-p.amount;p.name=v('roundName')||p.name;p.amount=n;p.date=date;c.total=(Number(c.total)||0)+diff;save();closeModal();render();toast(diff?'회차와 계약 총액을 함께 수정했어요':'회차를 수정했어요')}
function deleteRound(cid,pid){const c=state.contracts.find(x=>x.id===cid),p=c?.payments.find(x=>x.id===pid);if(!p)return;if(!confirm(p.paid>0?`이 회차에는 이미 낸 ${fmtMoney(p.paid)}이 있어요. 지급 기록까지 함께 삭제되고 계약 총액도 ${fmtMoney(p.amount)} 줄어요. 삭제할까요?`:`'${p.name}' 회차를 삭제할까요? 계약 총액도 ${fmtMoney(p.amount)} 줄어요.`))return;c.payments=c.payments.filter(x=>x.id!==pid);c.total=Math.max(0,(Number(c.total)||0)-(Number(p.amount)||0));save();closeModal();render();toast('회차를 삭제했어요')}
function openContractEdit(id){const c=state.contracts.find(x=>x.id===id);if(!c)return;modal('계약 수정','업체 정보와 총액을 고칠 수 있어요.',`<div class="fields"><div class="field"><label>업체명</label><input id="ceVendor" value="${esc(c.vendor)}"></div><div class="row2"><div class="field"><label>카테고리</label><select id="ceCategory">${categoryOptions(c.category)}</select></div><div class="field"><label>계약 총액</label><input id="ceTotal" type="text" inputmode="numeric" data-money="true" value="${c.total}"><div class="money-preview" id="ceTotalPreview"></div></div></div><div class="field"><label>계약일</label><input id="ceDate" type="date" value="${esc(c.contractDate||'')}"></div><p class="small muted">총액을 바꾸면 차액은 마지막 미지급 회차(보통 잔금)에 반영돼요.</p></div>`,`saveContractEdit('${id}')`)}
function saveContractEdit(id){const c=state.contracts.find(x=>x.id===id);if(!c)return;const vendor=v('ceVendor'),total=moneyNumber('ceTotal');if(!vendor||!Number.isFinite(total)||total<=0)return alert('업체명과 총액을 확인해 주세요.');const allocated=c.payments.reduce((s,p)=>s+(Number(p.amount)||0),0);const diff=total-allocated;if(diff!==0){const target=[...c.payments].reverse().find(p=>(Number(p.amount)||0)-(Number(p.paid)||0)+diff>=0&&(diff>0||p.amount-p.paid>0));if(target)target.amount+=diff;else if(diff>0)c.payments.push({id:uid(),name:'잔금',amount:diff,date:'',paid:0,transactions:[]});else return alert('줄일 수 있는 미지급 회차가 부족해요. 회차를 먼저 정리해 주세요.');}Object.assign(c,{vendor,category:v('ceCategory'),contractDate:v('ceDate'),total});save();closeModal();render();toast('계약을 수정했어요')}
function deleteContract(id){const c=state.contracts.find(x=>x.id===id);if(!c)return;const paid=c.payments.reduce((s,p)=>s+(Number(p.paid)||0),0);if(!confirm(`'${c.vendor}' 계약을 삭제할까요?${paid>0?` 이미 낸 ${fmtMoney(paid)} 지급 기록도 함께 사라져요.`:''}`))return;state.contracts=state.contracts.filter(x=>x.id!==id);state.events.forEach(e=>{if(e.contractId===id)e.contractId=''});expandedContracts.delete(id);save();render();toast('계약을 삭제했어요')}

function exportCSV(){ let rows=[['구분','날짜','항목','카테고리','금액','상태','결제수단','비고']]; state.contracts.forEach(c=>c.payments.forEach(p=>rows.push(['계약지급',p.date,`${c.vendor} ${p.name}`,c.category,p.amount,`지급 ${p.paid}`,paymentMethodLabel(p),(p.transactions||[]).map(t=>[t.payer?who(t.payer):'',t.memo||''].filter(Boolean).join(' ')).join(' / ')]))); state.expenses.forEach(e=>rows.push(['개별지출',e.date,e.name,e.category,e.amount,'지급완료','',who(e.payer==='파트너'?'파트너':'나')+' 결제'])); download('marriple-finance.csv', rows.map(r=>r.map(x=>{let t=String(x??'');if(/^[=+\-@]/.test(t)&&isNaN(Number(t)))t="'"+t;return '"'+t.replace(/"/g,'""')+'"'}).join(',')).join('\r\n'),'text/csv;charset=utf-8'); }
function exportICS(){ const esc=s=>String(s).replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;'); const all=[...state.events.map(e=>({id:e.id,title:e.title,date:e.date,location:e.address||e.place||''})), ...upcomingPayments().map(p=>({id:p.id,title:`${p.vendor} ${p.name} 지급 ${fmtMoney(p.remaining)}`,date:p.date,location:''}))]; let lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Marriple//KO']; all.filter(e=>e.date).forEach(e=>{ const d1=e.date.replace(/-/g,''); const dt=new Date(e.date+'T00:00:00'); dt.setDate(dt.getDate()+1); const d2=dayKey(dt).replace(/-/g,''); lines.push('BEGIN:VEVENT',`UID:${e.id}@marriple`,`DTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'')}`,`DTSTART;VALUE=DATE:${d1}`,`DTEND;VALUE=DATE:${d2}`,`SUMMARY:${esc(e.title)}`,...(e.location?[`LOCATION:${esc(e.location)}`]:[]),'END:VEVENT'); }); lines.push('END:VCALENDAR'); download('marriple-calendar.ics', lines.join('\r\n'),'text/calendar;charset=utf-8'); }
function download(name,body,type){ const blob=new Blob(['\ufeff',body],{type}); const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(u),1500); }
function resetDemo(){ if(!confirm('메리플 데모 데이터를 초기 상태로 되돌릴까요?')) return; state=defaults(); save(); render(); }
function toast(msg){ document.querySelectorAll('.toast').forEach(t=>t.remove()); const div=document.createElement('div'); div.className='toast'; div.textContent=msg; document.body.appendChild(div); setTimeout(()=>div.remove(),2200); }
render();
initAuth();

// First-launch presentation only: don't change the current page, auth session or user data.
(function finishSplash(){
  const splash=document.getElementById('marripleSplash');
  if(!splash)return;
  const begin=performance.now();
  const showFor=1250;
  const wait=Math.max(0,showFor-(performance.now()-begin));
  window.setTimeout(()=>{
    splash.classList.add('splash-hide');
    window.setTimeout(()=>splash.remove(),460);
  },wait);
})();

</script>
</body>
